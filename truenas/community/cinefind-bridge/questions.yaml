groups:
  - name: CineFind Bridge Configuration
    description: Connect CineFind to your local Seerr service without exposing it online.
  - name: Storage Configuration
    description: Store the revocable device token locally on TrueNAS.

questions:
  - variable: bridge
    label: ''
    group: CineFind Bridge Configuration
    schema:
      type: dict
      attrs:
        - variable: pairing_code
          label: CineFind Pairing Code
          description: Create this one-time 10-character code in CineFind Account → CineFind Bridge. It expires after 15 minutes.
          schema:
            type: string
            default: ''
            required: true
            private: true
        - variable: seerr_url
          label: Local Seerr URL
          description: Your local Seerr URL, for example http://192.168.178.195:5055. Do not use a public proxy URL.
          schema:
            type: string
            default: ''
            required: true
        - variable: seerr_api_key
          label: Seerr API Key
          description: Create this key in Seerr. It stays inside this TrueNAS app and is never sent to CineFind.
          schema:
            type: string
            default: ''
            required: true
            private: true
        - variable: display_name
          label: Device Name
          description: A friendly name shown in your CineFind account.
          schema:
            type: string
            default: TrueNAS
            max_length: 80
            required: true
  - variable: storage
    label: ''
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: Bridge Data Storage
          description: Stores a revocable device token. Do not delete it unless you intend to pair again.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: ix_volume
                      description: ixVolume (managed by TrueNAS)
                    - value: host_path
                      description: Host Path (an existing TrueNAS directory)
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [[type, '=', ix_volume]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        hidden: true
                        default: data
                        required: true
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [[acl_enable, '=', true]]
                        $ref:
                          - normalize/acl
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [[type, '=', host_path]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [[acl_enable, '=', true]]
                        $ref:
                          - normalize/acl
                        attrs: []
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        required: true
