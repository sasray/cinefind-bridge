services:
  cinefind-bridge:
    image: ghcr.io/sasray/cinefind-bridge:latest
    container_name: cinefind-bridge
    restart: unless-stopped
    environment:
      CINEFIND_PAIRING_CODE: ${CINEFIND_PAIRING_CODE:?Create a pairing code in your CineFind account}
      SEERR_URL: ${SEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      CINEFIND_BRIDGE_NAME: ${CINEFIND_BRIDGE_NAME:-TrueNAS}
    volumes:
      - cinefind-bridge-data:/data

volumes:
  cinefind-bridge-data:
